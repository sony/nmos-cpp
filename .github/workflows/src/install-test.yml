- name: set install test environment variable
  shell: bash
  run: |
    # replace backslashes with forward slashes on Windows
    echo "CMAKE_WORKSPACE=${RUNNER_WORKSPACE//\\/\/}" >> $GITHUB_ENV

- name: install test
  if: runner.os != 'macOS'
  shell: bash
  run: |
    # a Visual Studio generator selects the compiler itself, and is multi-config, so the build selects Release
    if [[ -n "${{ matrix.vs_generator }}" ]]; then
      generator_args=(-G "${{ matrix.vs_generator }}")
    else
      generator_args=(-GNinja -DCMAKE_BUILD_TYPE=Release ${{ env.CMAKE_COMPILER_ARGS }})
    fi
    cmake -S "${{ env.GITHUB_WORKSPACE }}/Sandbox/my-nmos-node" \
      -B "${{ env.RUNNER_WORKSPACE }}/build-my-nmos-node" \
      "${generator_args[@]}" \
      -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=1 \
      -DCMAKE_PREFIX_PATH="${{ env.CMAKE_WORKSPACE }}/install;${{ env.CMAKE_WORKSPACE }}/build/conan"
    cmake --build "${{ env.RUNNER_WORKSPACE }}/build-my-nmos-node"${{ matrix.vs_generator && ' --config Release' || '' }}

- name: install test log
  if: runner.os != 'macOS'
  run: |
    # dump the log file created in Sandbox/my-nmos-node/CMakeLists.txt
    cat ${{ env.RUNNER_WORKSPACE }}/build-my-nmos-node/my-nmos-node_include-release.txt
