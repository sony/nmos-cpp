- name: unit test
  run: |
    cd ${{ env.RUNNER_WORKSPACE }}/build/
    ctest --output-on-failure${{ matrix.vs_generator && ' -C Release' || '' }} ${{ env.CTEST_EXTRA_ARGS }}

- name: expected unit test failures
  if: env.CTEST_EXPECTED_FAILURES != null
  continue-on-error: true
  run: |
    cd ${{ env.RUNNER_WORKSPACE }}/build/
    ctest --output-on-failure${{ matrix.vs_generator && ' -C Release' || '' }} ${{ env.CTEST_EXPECTED_FAILURES }}

